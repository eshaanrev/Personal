<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4a67aa&quot;,&quot;options&quot;:[&quot;#4a67aa&quot;,&quot;#5e7bb8&quot;,&quot;#5b8c7b&quot;,&quot;#bd5a34&quot;,&quot;#b4ab9b&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    this.applyTweaks();
    const els = Array.from(document.querySelectorAll('[data-reveal]'));
    els.forEach((el) => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(20px)';
      const d = el.getAttribute('data-delay') || '0';
      el.style.transition = 'opacity .8s cubic-bezier(.2,.6,.2,1) ' + d + 'ms, transform .8s cubic-bezier(.2,.6,.2,1) ' + d + 'ms';
      el.style.willChange = 'opacity, transform';
    });
    const reveal = (el) => { el.style.opacity = '1'; el.style.transform = 'none'; };
    els.forEach(reveal);
    this._safety = setTimeout(() => els.forEach((el) => { el.style.transition = 'none'; reveal(el); }), 1300);
  }

  componentDidUpdate() { this.applyTweaks(); }

  componentWillUnmount() { if (this._safety) clearTimeout(this._safety); }

  applyTweaks() {
    const root = document.querySelector('[data-site-root]');
    if (root) root.style.setProperty('--accent', this.props.accent || '#4a67aa');
  }

  renderVals() { return {}; }
}
</script>
